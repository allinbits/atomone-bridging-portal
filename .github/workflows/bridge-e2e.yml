name: Bridge E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  bridge-e2e:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: spectre-a1-eth-bridge
          - test: spectre-eth-a1-bridge
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packet delivery (and thus the opt-in ACK waits) needs the relayer
      # against the devnet spectre deployment, which CI does not run; the tests
      # assert the send legs only and skip the waits by default.
      - name: Run ${{ matrix.test }}
        env:
          TEST_MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
          TEST_EVM_ADDRESS: ${{ secrets.TEST_EVM_ADDRESS }}
          TEST_EVM_PRIVATE_KEY: ${{ secrets.TEST_EVM_PRIVATE_KEY }}
          TEST_ENABLE_WAIT_FOR_ACK: "false"
        run: >
          npx vitest run
          --config vitest.e2e.config.ts
          tests/e2e/${{ matrix.test }}.test.ts
          --reporter=verbose
